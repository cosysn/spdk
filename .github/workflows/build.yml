name: Build SPDK

on:
  push:
    branches: [master, ioperf]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc \
            g++ \
            make \
            libcunit1-dev \
            libaio-dev \
            libssl-dev \
            libjson-c-dev \
            libcmocka-dev \
            uuid-dev \
            libiscsi-dev \
            libkeyutils-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3 \
            python3-pip \
            python3-dev \
            unzip \
            libfuse3-dev \
            patchelf \
            curl \
            procps \
            pkgconf \
            python3-venv \
            python3-configshell-fb \
            python3-pexpect \
            python3-tabulate \
            nasm \
            libnuma-dev \
            autoconf \
            automake \
            libtool \
            help2man \
            systemtap-sdt-dev

      - name: Install meson
        run: |
          pip3 install --user meson ninja pyelftools

      - name: Configure
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./configure --without-nvme-cuse

      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make -j$(nproc)
          make -C examples/bdev

      - name: Run unit tests
        run: ./test/unit/unittest.sh

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdk-x86
          path: |
            build/bin/
            build/examples/bdevperf
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cross-compile toolchain
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libncurses5-dev \
            crossbuild-essential-arm64

      - name: Install meson
        run: |
          pip3 install --user meson ninja pyelftools

      - name: Configure ARM64
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ ./configure --without-nvme-cuse --target-arch=arm64

      - name: Build ARM64
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make -j$(nproc)

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdk-arm64
          path: build/bin/
          retention-days: 7

  release:
    needs: [build-x86, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/spdk-x86/*
            artifacts/spdk-arm64/*
          tag_name: build-${{ github.sha }}
          name: SPDK Build ${{ github.sha }}
          draft: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}