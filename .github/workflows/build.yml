name: Build SPDK

on:
  push:
    branches: [master, '**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc \
            g++ \
            make \
            libcunit1-dev \
            libaio-dev \
            libssl-dev \
            libjson-c-dev \
            libcmocka-dev \
            uuid-dev \
            libiscsi-dev \
            libkeyutils-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3 \
            python3-pip \
            python3-dev \
            unzip \
            libfuse3-dev \
            patchelf \
            curl \
            procps \
            pkgconf \
            python3-venv \
            python3-configshell-fb \
            python3-pexpect \
            python3-tabulate \
            nasm \
            libnuma-dev \
            autoconf \
            automake \
            libtool \
            help2man \
            systemtap-sdt-dev

      - name: Install meson
        run: |
          pip3 install --user meson ninja pyelftools

      - name: Configure
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./configure --without-nvme-cuse

      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make -j$(nproc)

      - name: Run unit tests
        run: ./test/unit/unittest.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spdk-binaries
          path: build/bin/
          retention-days: 7
