name: Build SPDK

on:
  push:
    branches: [master, 'spdk-*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            pkg-config \
            libaio-dev \
            libnuma-dev \
            libssl-dev \
            uuid-dev \
            liburing-dev \
            python3 \
            python3-pip

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Run unit tests
        run: ./test/unit/unittest.sh
